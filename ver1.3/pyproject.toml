[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jp-speech-eval"
version = "1.6.0"
description = "Lightweight Japanese speech evaluation prototype with robust endpointing, recording-quality gates, mora-level evidence, F0, prosody, fluency, and multi-mode evaluation."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24,<2.0",
  "scipy>=1.10",
  "librosa>=0.10.1",
  "soundfile>=0.12",
  "matplotlib>=3.7",
  "pyopenjtalk",
  "pyworld-prebuilt",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.2"]
recording = ["sounddevice>=0.4"]
analysis = ["pandas>=2.0"]
ssl = ["torch>=2.0", "transformers>=4.30"]
google-tts = ["google-cloud-texttospeech>=2.16"]
full = [
  "faster-whisper>=1.2",
  "sounddevice>=0.4",
  "pandas>=2.0",
  "torch>=2.0",
  "transformers>=4.30",
  "google-cloud-texttospeech>=2.16",
]
dev = ["build>=1.2", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jp_speech_eval = [
  "resources/configs/*.json",
  "resources/results/calibration/*.json",
]
