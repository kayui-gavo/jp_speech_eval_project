name: v10-listener-context-audio-patch
on:
  push:
    paths:
      - '.github/workflows/v10-listener-context-audio-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-speech-promotion-readiness-v10
          fetch-depth: 0
      - name: Add contextual-audio guard to permanent CI
        run: python ver1.3/scripts/_patch_listener_context_audio_v10.py
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/baseline-evolution-light-tests.yml
          git commit -m 'ci: guard contextual audio listener playback'
          git push origin HEAD:free-speech-promotion-readiness-v10
