name: v6-one-shot-final-karaoke-polish

on:
  push:
    branches:
      - karaoke-consumer-ui-v6
    paths:
      - ".github/workflows/v6-self-patch-final-karaoke-polish.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: karaoke-consumer-ui-v6
      - name: Tighten alignment fallback and add pitch legend
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ver1.3/src/jp_speech_eval/app_core/karaoke_timeline.py")
          text = path.read_text(encoding="utf-8")
          old = '''    approximate = bool(\n        alignment.get("used_equal_fallback")\n        or alignment_mode == "equal"\n        or alignment_mode.endswith("fallback_equal")\n        or (confidence is not None and confidence < 0.50)\n    )\n    rows: List[Dict[str, Any]] = []\n    for raw in raw_rows:\n'''
          new = '''    approximate = bool(\n        alignment.get("used_equal_fallback")\n        or alignment.get("available") is False\n        or alignment_mode == "equal"\n        or alignment_mode.endswith("fallback_equal")\n        or confidence is None\n        or confidence < 0.50\n    )\n    rows: List[Dict[str, Any]] = []\n    for source_index, raw in enumerate(raw_rows):\n'''
          if old not in text:
              raise SystemExit("alignment fallback anchor missing")
          text = text.replace(old, new, 1)

          old = '''            "text": mora,\n            "start_sec": start,\n'''
          new = '''            "text": mora,\n            "source_index": source_index,\n            "start_sec": start,\n'''
          if old not in text:
              raise SystemExit("mora source index anchor missing")
          text = text.replace(old, new, 1)

          old = '''    user_hz = [_mapping(row).get("f0_hz") for row in raw_rows[:len(moras)]]\n    reference_hz_raw = details.get("reference_f0_by_mora") if isinstance(details.get("reference_f0_by_mora"), list) else []\n    reference_hz = list(reference_hz_raw[:len(moras)])\n    if len(reference_hz) < len(moras):\n        reference_hz.extend([None] * (len(moras) - len(reference_hz)))\n'''
          new = '''    source_indices = [int(_finite(mora.get("source_index")) or 0) for mora in moras]\n    user_hz = [\n        _mapping(raw_rows[index]).get("f0_hz") if 0 <= index < len(raw_rows) else None\n        for index in source_indices\n    ]\n    reference_hz_raw = details.get("reference_f0_by_mora") if isinstance(details.get("reference_f0_by_mora"), list) else []\n    reference_hz = [\n        reference_hz_raw[index] if 0 <= index < len(reference_hz_raw) else None\n        for index in source_indices\n    ]\n'''
          if old not in text:
              raise SystemExit("mora F0 index anchor missing")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          html_path = Path("ver1.3/debug_ui/consumer_v3.html")
          html = html_path.read_text(encoding="utf-8")
          old = '''      drawSeries(points,getComputedStyle(document.documentElement).getPropertyValue('--rose').trim()||'#9a5c6c',false);\n      if(refPoints.length)drawSeries(refPoints,getComputedStyle(document.documentElement).getPropertyValue('--gold').trim()||'#b18e58',true);\n    }\n'''
          new = '''      const rose=getComputedStyle(document.documentElement).getPropertyValue('--rose').trim()||'#9a5c6c', gold=getComputedStyle(document.documentElement).getPropertyValue('--gold').trim()||'#b18e58';\n      drawSeries(points,rose,false);\n      if(refPoints.length){\n        drawSeries(refPoints,gold,true);\n        ctx.font='11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.textBaseline='middle';\n        ctx.strokeStyle=rose;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(12,16);ctx.lineTo(32,16);ctx.stroke();ctx.fillStyle=rose;ctx.fillText('あなた',38,16);\n        ctx.strokeStyle=gold;ctx.lineWidth=1.5;ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(92,16);ctx.lineTo(112,16);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=gold;ctx.fillText('お手本',118,16);\n      }\n    }\n'''
          if old not in html:
              raise SystemExit("pitch legend anchor missing")
          html = html.replace(old, new, 1)
          html_path.write_text(html, encoding="utf-8")
          PY
      - name: Commit final polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add ver1.3/src/jp_speech_eval/app_core/karaoke_timeline.py ver1.3/debug_ui/consumer_v3.html
          git commit -m "ui: tighten karaoke alignment confidence and curve legend"
          git push origin HEAD:karaoke-consumer-ui-v6
