name: v6-one-shot-report-count

on:
  push:
    branches:
      - karaoke-consumer-ui-v6
    paths:
      - ".github/workflows/v6-self-patch-report-count.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: karaoke-consumer-ui-v6
      - name: Synchronize final test count
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("ver1.3/reports/KARAOKE_CONSUMER_UI_V6.md")
          text = path.read_text(encoding="utf-8")
          old = "- 147 tests passed;"
          new = "- 148 tests passed;"
          if old not in text:
              raise SystemExit("test-count anchor missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit report sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add ver1.3/reports/KARAOKE_CONSUMER_UI_V6.md
          git commit -m "docs: synchronize final v6 regression count"
          git push origin HEAD:karaoke-consumer-ui-v6
