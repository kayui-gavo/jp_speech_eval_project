name: v4-one-shot-free-speech-evidence-wiring

on:
  push:
    branches:
      - free-speech-four-dimension-evidence-v4
    paths:
      - ".github/workflows/v4-self-patch-free-speech-evidence.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-speech-four-dimension-evidence-v4
      - name: Patch ASR diagnostics, transcript evidence, and evidence state
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Preserve existing faster-whisper/OpenAI-Whisper decoder diagnostics.
          path = Path("ver1.3/src/jp_speech_eval/asr.py")
          text = path.read_text(encoding="utf-8")
          old = '''    language_probability: Optional[float] = None\n    words: Optional[List[Dict[str, Any]]] = None\n\n    def to_dict(self) -> Dict:\n'''
          new = '''    language_probability: Optional[float] = None\n    words: Optional[List[Dict[str, Any]]] = None\n    segments: Optional[List[Dict[str, Any]]] = None\n\n    def to_dict(self) -> Dict:\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("AsrTranscript dataclass anchor not found")
              text = text.replace(old, new, 1)

          old = '''            segments = list(segment_iter)\n            text = "".join(seg.text for seg in segments).strip()\n            words: List[Dict[str, Any]] | None = None\n'''
          new = '''            segments = list(segment_iter)\n            text = "".join(seg.text for seg in segments).strip()\n            segment_metrics: List[Dict[str, Any]] = []\n            for segment in segments:\n                segment_metrics.append(\n                    {\n                        "start_sec": round(float(getattr(segment, "start", 0.0) or 0.0), 6),\n                        "end_sec": round(float(getattr(segment, "end", 0.0) or 0.0), 6),\n                        "avg_logprob": (\n                            None\n                            if getattr(segment, "avg_logprob", None) is None\n                            else round(float(getattr(segment, "avg_logprob")), 6)\n                        ),\n                        "no_speech_prob": (\n                            None\n                            if getattr(segment, "no_speech_prob", None) is None\n                            else round(float(getattr(segment, "no_speech_prob")), 6)\n                        ),\n                        "compression_ratio": (\n                            None\n                            if getattr(segment, "compression_ratio", None) is None\n                            else round(float(getattr(segment, "compression_ratio")), 6)\n                        ),\n                    }\n                )\n            words: List[Dict[str, Any]] | None = None\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("faster-whisper segment anchor not found")
              text = text.replace(old, new, 1)

          old = '''            probability,\n            words,\n        )\n'''
          new = '''            probability,\n            words,\n            segment_metrics,\n        )\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("faster-whisper return anchor not found")
              text = text.replace(old, new, 1)

          old = '''        return AsrTranscript(\n            True,\n            "openai-whisper",\n            model_name,\n            str(result.get("text", "")).strip(),\n            str(result.get("language", language or "") or ""),\n            "ok",\n        )\n'''
          new = '''        segment_metrics: List[Dict[str, Any]] = []\n        for raw_segment in result.get("segments", []) or []:\n            if not isinstance(raw_segment, dict):\n                continue\n            segment_metrics.append(\n                {\n                    "start_sec": raw_segment.get("start"),\n                    "end_sec": raw_segment.get("end"),\n                    "avg_logprob": raw_segment.get("avg_logprob"),\n                    "no_speech_prob": raw_segment.get("no_speech_prob"),\n                    "compression_ratio": raw_segment.get("compression_ratio"),\n                }\n            )\n        return AsrTranscript(\n            True,\n            "openai-whisper",\n            model_name,\n            str(result.get("text", "")).strip(),\n            str(result.get("language", language or "") or ""),\n            "ok",\n            None,\n            None,\n            segment_metrics,\n        )\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("openai-whisper return anchor not found")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          # 2) Build free-speech construct-separated evidence without changing scores.
          path = Path("ver1.3/src/jp_speech_eval/transcript_assisted.py")
          text = path.read_text(encoding="utf-8")
          old = '''from .config import load_scoring_config\nfrom .recording_quality import assess_recording_quality\n'''
          new = '''from .config import load_scoring_config\nfrom .free_speech_evidence import (\n    build_free_speech_dimension_evidence,\n    build_shadow_candidate_surface,\n)\nfrom .recording_quality import assess_recording_quality\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("transcript_assisted import anchor not found")
              text = text.replace(old, new, 1)

          old = '''    spontaneous_fluency_v2 = build_spontaneous_fluency_evidence(\n        mora_count=mora_count,\n        speech_duration_sec=speech_duration,\n        pause_info=pause_info,\n        transcript=transcript or "",\n        transcript_source=transcript_source,\n        silent_pause_threshold_sec=0.30,\n        word_timestamps=(\n            asr_info.get("words")\n            if isinstance(asr_info.get("words"), list)\n            else None\n        ),\n    )\n\n    feedback: List[str] = [\n'''
          new = '''    spontaneous_fluency_v2 = build_spontaneous_fluency_evidence(\n        mora_count=mora_count,\n        speech_duration_sec=speech_duration,\n        pause_info=pause_info,\n        transcript=transcript or "",\n        transcript_source=transcript_source,\n        silent_pause_threshold_sec=0.30,\n        word_timestamps=(\n            asr_info.get("words")\n            if isinstance(asr_info.get("words"), list)\n            else None\n        ),\n    )\n    free_speech_dimension_evidence = build_free_speech_dimension_evidence(\n        asr_info=asr_info,\n        speech_duration_sec=speech_duration,\n        f0_times=_times,\n        f0_hz=f0_arr,\n        spontaneous_fluency=spontaneous_fluency_v2,\n    )\n\n    feedback: List[str] = [\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("free speech evidence build anchor not found")
              text = text.replace(old, new, 1)

          old = '''    pronunciation_risk = 0.35 * clarity_score + 0.25 * prosody_score + 0.25 * fluency_score + 0.15 * recording_score\n    total = 0.30 * pronunciation_risk + 0.25 * prosody_score + 0.30 * fluency_score + 0.15 * recording_score\n\n    reliability = {\n'''
          new = '''    pronunciation_risk = 0.35 * clarity_score + 0.25 * prosody_score + 0.25 * fluency_score + 0.15 * recording_score\n    total = 0.30 * pronunciation_risk + 0.25 * prosody_score + 0.30 * fluency_score + 0.15 * recording_score\n    free_speech_candidate_surface = build_shadow_candidate_surface(\n        free_speech_dimension_evidence,\n        current_fluency_score=fluency_score,\n    )\n\n    reliability = {\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("candidate surface anchor not found")
              text = text.replace(old, new, 1)

          old = '''            "spontaneous_fluency_v2": spontaneous_fluency_v2,\n            "recording_quality": {\n'''
          new = '''            "spontaneous_fluency_v2": spontaneous_fluency_v2,\n            "shadow": {\n                "free_speech_dimension_evidence": free_speech_dimension_evidence,\n                "free_speech_candidate_surface": free_speech_candidate_surface,\n            },\n            "recording_quality": {\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("shadow detail anchor not found")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          # 3) Surface whether a numeric dimension is measured, broad proxy, or neutral prior.
          path = Path("ver1.3/src/jp_speech_eval/consumer_dimension_policy.py")
          text = path.read_text(encoding="utf-8")
          old = '''    score = _score(value) if available else None\n    return {\n        "key": key,\n'''
          new = '''    score = _score(value) if available else None\n    prior_fallback = source_field == "product_prior" or "prior" in str(evidence_tier).lower()\n    if score is None:\n        evidence_state = "unavailable"\n        precision_hint = "unavailable"\n    elif prior_fallback:\n        evidence_state = "neutral_prior"\n        precision_hint = "reference_only"\n    elif confidence == "low":\n        evidence_state = "broad_proxy"\n        precision_hint = "rough"\n    else:\n        evidence_state = "measured_proxy"\n        precision_hint = "normal"\n    return {\n        "key": key,\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("dimension metadata anchor not found")
              text = text.replace(old, new, 1)

          old = '''        "confidence": confidence,\n        "evidence_tier": evidence_tier,\n        "product_calibrated": False,\n'''
          new = '''        "confidence": confidence,\n        "evidence_tier": evidence_tier,\n        "evidence_state": evidence_state,\n        "precision_hint": precision_hint,\n        "numeric_semantics": (\n            "neutral_anchor_not_direct_measurement"\n            if evidence_state == "neutral_prior"\n            else "practice_proxy_not_formal_measurement"\n        ),\n        "product_calibrated": False,\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("dimension evidence state insertion anchor not found")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          # 4) Evidence schema changes, while numeric score contract intentionally stays v2.
          path = Path("ver1.3/src/jp_speech_eval/score_contract.py")
          text = path.read_text(encoding="utf-8")
          old = 'EVIDENCE_SCHEMA_VERSION = "consumer_evidence_v2"'
          new = 'EVIDENCE_SCHEMA_VERSION = "consumer_evidence_v3"'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("evidence schema version anchor not found")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ver1.3/src/jp_speech_eval/asr.py \
            ver1.3/src/jp_speech_eval/transcript_assisted.py \
            ver1.3/src/jp_speech_eval/consumer_dimension_policy.py \
            ver1.3/src/jp_speech_eval/score_contract.py
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "free speech: wire target-independent evidence shadow"
          git push origin HEAD:free-speech-four-dimension-evidence-v4
