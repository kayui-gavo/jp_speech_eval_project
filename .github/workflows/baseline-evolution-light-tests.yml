name: baseline-evolution-light-tests

on:
  push:
    branches:
      - baseline-evolution-v1
      - score-contract-evolution-v2
  pull_request:
    paths:
      - "ver1.3/src/jp_speech_eval/audio_features.py"
      - "ver1.3/src/jp_speech_eval/recording_quality.py"
      - "ver1.3/src/jp_speech_eval/sentence_cache.py"
      - "ver1.3/src/jp_speech_eval/ctc_posterior_diagnostics.py"
      - "ver1.3/src/jp_speech_eval/score_contract.py"
      - "ver1.3/src/jp_speech_eval/user_score_policy.py"
      - "ver1.3/src/jp_speech_eval/user_facing_policy.py"
      - "ver1.3/src/jp_speech_eval/feedback_renderer.py"
      - "ver1.3/src/jp_speech_eval/conversation_mode_policy.py"
      - "ver1.3/src/jp_speech_eval/ssl_features.py"
      - "ver1.3/src/jp_speech_eval/ssl_reference_panel.py"
      - "ver1.3/src/jp_speech_eval/rhythm_dtw.py"
      - "ver1.3/src/jp_speech_eval/shadow_assessment.py"
      - "ver1.3/src/jp_speech_eval/app_core/**"
      - "ver1.3/scripts/prepare_cache.py"
      - "ver1.3/scripts/audit_reference_boundary_provenance.py"
      - "ver1.3/scripts/validate_research_manifest.py"
      - "ver1.3/scripts/build_research_splits.py"
      - "ver1.3/scripts/validate_consumer_ratings.py"
      - "ver1.3/scripts/analyze_research_evidence.py"
      - "ver1.3/data/research_eval/**"
      - "ver1.3/data/human_eval/consumer_rating_schema_v2.json"
      - "ver1.3/tests/test_audio_input_domains.py"
      - "ver1.3/tests/test_reference_boundary_provenance.py"
      - "ver1.3/tests/test_reference_boundary_audit.py"
      - "ver1.3/tests/test_ctc_posterior_diagnostics.py"
      - "ver1.3/tests/test_score_contract.py"
      - "ver1.3/tests/test_conversation_mode_policy.py"
      - "ver1.3/tests/test_rhythm_dtw.py"
      - "ver1.3/tests/test_ssl_reference_panel.py"
      - "ver1.3/tests/test_research_manifest.py"
      - "ver1.3/tests/test_research_splits.py"
      - "ver1.3/tests/test_research_evidence_analysis.py"
      - "ver1.3/tests/test_consumer_ratings.py"
      - "ver1.3/tests/test_app_core_mvp.py"
      - ".github/workflows/baseline-evolution-light-tests.yml"

jobs:
  light-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ver1.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight runtime
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            "numpy>=1.24,<2.0" \
            "scipy>=1.10,<2.0" \
            "librosa>=0.10.1,<1.0" \
            "soundfile>=0.12,<1.0" \
            "matplotlib>=3.7,<4.0" \
            "pyopenjtalk-plus==0.4.1.post8" \
            "pyworld-prebuilt>=0.3.5,<0.4" \
            pytest
          python -m pip install -e .
      - name: Run baseline evolution guards
        run: |
          python -m pytest -q \
            tests/test_audio_input_domains.py \
            tests/test_reference_boundary_provenance.py \
            tests/test_reference_boundary_audit.py \
            tests/test_ctc_posterior_diagnostics.py \
            tests/test_alignment_evidence.py \
            tests/test_alignment_v31.py \
            tests/test_content_match_v2.py \
            tests/test_user_score_policy.py \
            tests/test_score_contract.py \
            tests/test_conversation_mode_policy.py \
            tests/test_rhythm_dtw.py \
            tests/test_ssl_reference_panel.py \
            tests/test_research_manifest.py \
            tests/test_research_splits.py \
            tests/test_research_evidence_analysis.py \
            tests/test_consumer_ratings.py \
            tests/test_app_core_mvp.py
