      - ".github/workflows/baseline-evolution-light-tests.yml"

jobs:
  light-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ver1.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight runtime
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            "numpy>=1.24,<2.0" \
            "scipy>=1.10,<2.0" \
            "librosa>=0.10.1,<1.0" \
            "soundfile>=0.12,<1.0" \
            "matplotlib>=3.7,<4.0" \
            "pyopenjtalk-plus==0.4.1.post8" \
            "pyworld-prebuilt>=0.3.5,<0.4" \
            pytest
          python -m pip install -e .
      - name: Run baseline evolution guards
        run: |
          python -m pytest -q \
            tests/test_audio_input_domains.py \
            tests/test_reference_boundary_provenance.py \
            tests/test_reference_boundary_audit.py \
            tests/test_ctc_posterior_diagnostics.py \
            tests/test_alignment_evidence.py \
            tests/test_alignment_v31.py \
            tests/test_content_match_v2.py \
            tests/test_user_score_policy.py \
            tests/test_score_contract.py \
            tests/test_score_evidence_quality_v9.py \
            tests/test_conversation_mode_policy.py \
            tests/test_transcript_assisted_language_gate.py \
            tests/test_scoring_integrity_v8.py \
            tests/test_partial_evidence_aggregate.py \
            tests/test_partial_evidence_analysis.py \
            tests/test_spontaneous_fluency.py \
            tests/test_free_speech_evidence.py \
            tests/test_free_speech_v4_pipeline.py \
            tests/test_free_speech_sample_manifest_v5.py \
            tests/test_consumer_ratings_v3.py \
            tests/test_free_speech_validation_batch_v5.py \
            tests/test_free_speech_acceptance_v8.py \
            tests/test_free_speech_v5_evidence_export.py \
            tests/test_free_speech_promotion_v5.py \
            tests/test_free_speech_promotion_v10.py \
            tests/test_historical_free_speech_reuse_v10.py \
            tests/test_free_speech_promotion_readiness_runner_v10.py \
            tests/test_karaoke_timeline.py \
            tests/test_consumer_karaoke_ui.py \
            tests/test_hf_space_karaoke_v7.py \
            tests/test_reliability_counterfactual.py \
            tests/test_native_cap_telemetry.py \
            tests/test_rhythm_dtw.py \
            tests/test_ssl_reference_panel.py \
            tests/test_research_manifest.py \
            tests/test_research_splits.py \
            tests/test_research_evidence_analysis.py \
            tests/test_consumer_ratings.py \
            tests/test_app_core_mvp.py
      - name: Audit reliability caps on existing acceptance JSONL
        run: |
          python scripts/run_reliability_cap_ab.py \
            outputs/c_end_v2_acceptance/new_results.jsonl \
            --input-format acceptance-jsonl \
            --out-csv /tmp/reliability_cap_ab.csv \
            --out-json /tmp/reliability_cap_ab.json
          cat /tmp/reliability_cap_ab.json
