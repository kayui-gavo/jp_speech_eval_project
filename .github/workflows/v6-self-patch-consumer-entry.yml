name: v6-one-shot-consumer-entry

on:
  push:
    branches:
      - karaoke-consumer-ui-v6
    paths:
      - ".github/workflows/v6-self-patch-consumer-entry.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: karaoke-consumer-ui-v6
      - name: Polish consumer entry and upload semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          html_path = Path("ver1.3/debug_ui/consumer_v3.html")
          html = html_path.read_text(encoding="utf-8")
          old = '''              <label class="upload"><input id="upload" type="file" accept="audio/*"><button class="ghost" id="uploadProxy" type="button">音声ファイルを選ぶ</button></label>'''
          new = '''              <input id="upload" type="file" accept="audio/*" hidden>\n              <div class="upload"><button class="ghost" id="uploadProxy" type="button">音声ファイルを選ぶ</button></div>'''
          if old not in html:
              raise SystemExit("upload markup anchor missing")
          html = html.replace(old, new, 1)
          html_path.write_text(html, encoding="utf-8")

          server_path = Path("ver1.3/scripts/debug_ui.py")
          text = server_path.read_text(encoding="utf-8")
          old = '''    def do_GET(self) -> None:\n        if self.path == "/api/config":\n'''
          new = '''    def do_GET(self) -> None:\n        if self.path in {"/consumer", "/consumer/"}:\n            self.path = "/consumer_v3.html"\n            return super().do_GET()\n        if self.path == "/api/config":\n'''
          if old not in text:
              raise SystemExit("do_GET anchor missing")
          text = text.replace(old, new, 1)

          old = '''    print(f"Debug UI: http://{args.host}:{args.port}")\n    print(f"Cache   : {server.cache_prefix}")\n'''
          new = '''    print(f"Debug UI: http://{args.host}:{args.port}")\n    print(f"Consumer: http://{args.host}:{args.port}/consumer")\n    print(f"Cache   : {server.cache_prefix}")\n'''
          if old not in text:
              raise SystemExit("server print anchor missing")
          text = text.replace(old, new, 1)
          server_path.write_text(text, encoding="utf-8")
          PY
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add ver1.3/debug_ui/consumer_v3.html ver1.3/scripts/debug_ui.py
          git commit -m "ui: polish consumer upload and route entry"
          git push origin HEAD:karaoke-consumer-ui-v6
