name: v9-ui-reliability-patch
on:
  push:
    paths:
      - '.github/workflows/v9-ui-reliability-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: score-evidence-reliability-v9
          fetch-depth: 0
      - name: Patch established Space reliability semantics
        shell: bash
        run: python ver1.3/scripts/patch_score_evidence_ui_v9.py
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ver1.3/debug_ui/index.html
          git commit -m 'ui: separate recording status from score evidence'
          git push origin HEAD:score-evidence-reliability-v9
