name: phone-gop-preflight

on:
  push:
    branches:
      - free-assessment-integration-v1
  workflow_dispatch:
    inputs:
      run_model_preflight:
        description: "Download pinned Japanese phone-CTC model and run bundled-audio preflight"
        required: false
        default: true
        type: boolean

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ver1.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ver1.3/requirements.txt
      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Hosted runners do not need CUDA for this project. Preinstall a CPU
          # wheel so the broad torch>=2 requirement does not pull multi-GB CUDA
          # dependencies into every validation run.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0,<3.0"
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install "pytest>=8,<10"
      - name: Generate pyopenjtalk-plus target snapshot candidate
        run: python scripts/generate_phone_target_snapshot.py --output outputs/phone_target_snapshot_candidate_ci.json
      - name: Run ordinary tests
        run: python -m pytest -q
      - name: Upload target snapshot candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-target-snapshot-candidate
          path: ver1.3/outputs/phone_target_snapshot_candidate_ci.json
          if-no-files-found: warn

  model-preflight:
    # Model download/inference is intentionally not run on every editing commit.
    # A push runs it only when the commit message contains [run-model-preflight].
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_model_preflight) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-model-preflight]')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ver1.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ver1.3/requirements.txt
      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: phone-gop-hf-${{ runner.os }}-beatrice-v4-f5fe070
      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0,<3.0"
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Run pinned-model preflight on bundled audio
        run: python scripts/run_phone_gop_preflight.py --allow-download --output outputs/phone_gop_preflight_ci.json
      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-gop-preflight-report
          path: ver1.3/outputs/phone_gop_preflight_ci.json
          if-no-files-found: warn
