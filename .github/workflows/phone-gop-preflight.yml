name: phone-gop-preflight

on:
  push:
    branches:
      - free-assessment-integration-v1
  workflow_dispatch:
    inputs:
      run_model_preflight:
        description: "Download pinned Japanese phone-CTC models and run bundled/native-anchor preflight"
        required: false
        default: true
        type: boolean

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ver1.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ver1.3/requirements.txt
      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0,<3.0"
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install "pytest>=8,<10"
      - name: Generate pyopenjtalk-plus target snapshot candidate
        run: python scripts/generate_phone_target_snapshot.py --output outputs/phone_target_snapshot_candidate_ci.json
      - name: Run ordinary tests
        run: python -m pytest -q
      - name: Upload target snapshot candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-target-snapshot-candidate
          path: ver1.3/outputs/phone_target_snapshot_candidate_ci.json
          if-no-files-found: warn

  model-preflight:
    # Model download/inference is intentionally not run on every editing commit.
    # A push runs it only when the commit message contains [run-model-preflight].
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_model_preflight) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-model-preflight]')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ver1.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ver1.3/requirements.txt
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: phone-gop-hf-${{ runner.os }}-beatrice-f5fe070-distil-01ffc3e-wavlm-47fa985
      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0,<3.0"
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Resolve immutable revisions for alternative dual-CTC candidates
        run: python scripts/resolve_phone_ctc_candidate_revision.py --output outputs/phone_ctc_candidate_revisions.json
      - name: Download official JVS sample anchors ephemerally
        run: >-
          python scripts/download_official_jvs_samples.py
          --output-dir outputs/jvs_official_samples
          --manifest outputs/jvs_official_samples_manifest.json
      - name: Run pinned Beatrice backend preflight on bundled audio
        run: python scripts/run_phone_gop_preflight.py --allow-download --output outputs/phone_gop_preflight_ci.json
      - name: Run Beatrice segmentation-free SD and Occ feature preflight
        run: python scripts/run_segmentation_free_gop_preflight.py --allow-download --output outputs/segmentation_free_gop_preflight_ci.json
      - name: Run pinned DistilHuBERT dual-CTC shadow preflight
        run: >-
          python scripts/run_dual_ctc_candidate_preflight.py
          --allow-download
          --model TylorShine/distilhubert-hiragana-ctc
          --revision 01ffc3e5b0e49ba34180d50c48ea4111aa041cfd
          --output outputs/distilhubert_dual_ctc_preflight_ci.json
      - name: Run pinned WavLM dual-CTC research preflight
        run: >-
          python scripts/run_dual_ctc_candidate_preflight.py
          --allow-download
          --model TylorShine/wavlm-base-plus-hiragana-ctc
          --revision 47fa985035342365bcec4948bd821aaf58dd778a
          --output outputs/wavlm_dual_ctc_preflight_ci.json
      - name: Run three-backbone official JVS native-anchor preflight
        run: >-
          python scripts/run_official_jvs_phone_ctc_anchor_preflight.py
          --manifest outputs/jvs_official_samples_manifest.json
          --allow-download
          --output outputs/jvs_native_phone_ctc_anchor_preflight.json
      - name: Run Beatrice restricted-substitution JVS native false-alarm preflight
        run: >-
          python scripts/run_jvs_restricted_gop_preflight.py
          --manifest outputs/jvs_official_samples_manifest.json
          --allow-download
          --output outputs/jvs_restricted_gop_preflight.json
      - name: Remove downloaded JVS audio before artifact collection
        if: always()
        run: rm -rf outputs/jvs_official_samples
      - name: Upload model preflight reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-gop-preflight-report
          path: |
            ver1.3/outputs/phone_gop_preflight_ci.json
            ver1.3/outputs/segmentation_free_gop_preflight_ci.json
            ver1.3/outputs/phone_ctc_candidate_revisions.json
            ver1.3/outputs/distilhubert_dual_ctc_preflight_ci.json
            ver1.3/outputs/wavlm_dual_ctc_preflight_ci.json
            ver1.3/outputs/jvs_official_samples_manifest.json
            ver1.3/outputs/jvs_native_phone_ctc_anchor_preflight.json
            ver1.3/outputs/jvs_restricted_gop_preflight.json
          if-no-files-found: warn
