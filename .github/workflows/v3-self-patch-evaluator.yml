name: v3-one-shot-evaluator-cap-telemetry

on:
  push:
    branches:
      - fluency-reliability-evolution-v3
    paths:
      - ".github/workflows/v3-self-patch-evaluator.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fluency-reliability-evolution-v3
      - name: Insert reliability-cap telemetry without changing scores
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ver1.3/src/jp_speech_eval/evaluator.py")
          text = path.read_text(encoding="utf-8")
          marker = '"schema_version": "reliability_cap_audit_v1"'
          if marker in text:
              print("telemetry already present")
              raise SystemExit(0)

          old = '''    tone_score, tone_fb, tone_details = score_tone_simple(f0_mora, y_speech, pause_info, config=config)\n    timing["scoring"] = time.perf_counter() - ts\n\n    reliability = _build_reliability(\n'''
          new = '''    tone_score, tone_fb, tone_details = score_tone_simple(f0_mora, y_speech, pause_info, config=config)\n    timing["scoring"] = time.perf_counter() - ts\n\n    # Freeze scorer outputs before reliability-driven caps. This is audit-only\n    # telemetry: the learner-facing score path below is intentionally unchanged.\n    pre_reliability_cap_scores = {\n        "pronunciation": int(pronunciation_score),\n        "prosody": int(prosody_score),\n        "fluency": int(fluency_score),\n        "tone": int(tone_score),\n    }\n\n    reliability = _build_reliability(\n'''
          if old not in text:
              raise SystemExit("first evaluator patch anchor not found")
          text = text.replace(old, new, 1)

          old = '''    score_adjustments: List[str] = []\n    if alignment_mode.endswith("fallback_equal"):\n        pronunciation_score = min(pronunciation_score, 80)\n'''
          new = '''    score_adjustments: List[str] = []\n    alignment_cap_triggered = alignment_mode.endswith("fallback_equal")\n    if alignment_cap_triggered:\n        pronunciation_score = min(pronunciation_score, 80)\n'''
          if old not in text:
              raise SystemExit("alignment cap anchor not found")
          text = text.replace(old, new, 1)

          old = '''    judgement_count = int(mora_evidence_summary.get("judgement_available_count", 0) or 0)\n    judgement_needed = max(3, int(len(text_info.moras) * 0.55))\n    if judgement_count < judgement_needed:\n        pronunciation_score = min(pronunciation_score, 60)\n'''
          new = '''    judgement_count = int(mora_evidence_summary.get("judgement_available_count", 0) or 0)\n    judgement_needed = max(3, int(len(text_info.moras) * 0.55))\n    mora_evidence_cap_triggered = judgement_count < judgement_needed\n    if mora_evidence_cap_triggered:\n        pronunciation_score = min(pronunciation_score, 60)\n'''
          if old not in text:
              raise SystemExit("mora evidence cap anchor not found")
          text = text.replace(old, new, 1)

          old = '''    if float(reliability.get("f0_coverage", 0.0) or 0.0) < 0.50:\n        prosody_score = min(prosody_score, 55)\n'''
          new = '''    f0_cap_triggered = float(reliability.get("f0_coverage", 0.0) or 0.0) < 0.50\n    if f0_cap_triggered:\n        prosody_score = min(prosody_score, 55)\n'''
          if old not in text:
              raise SystemExit("f0 cap anchor not found")
          text = text.replace(old, new, 1)

          old = '''    total_score = round(\n        (\n            aggregate_weights["pronunciation"] * pronunciation_score\n            + aggregate_weights["prosody"] * prosody_score\n            + aggregate_weights["fluency"] * fluency_score\n            + aggregate_weights["tone"] * tone_score\n        )\n        / aggregate_denominator\n    )\n    if float(reliability.get("overall", 0.0) or 0.0) < 0.75:\n        total_score = min(total_score, 82)\n'''
          new = '''    pre_component_cap_total = round(\n        (\n            aggregate_weights["pronunciation"] * pre_reliability_cap_scores["pronunciation"]\n            + aggregate_weights["prosody"] * pre_reliability_cap_scores["prosody"]\n            + aggregate_weights["fluency"] * pre_reliability_cap_scores["fluency"]\n            + aggregate_weights["tone"] * pre_reliability_cap_scores["tone"]\n        )\n        / aggregate_denominator\n    )\n    total_score = round(\n        (\n            aggregate_weights["pronunciation"] * pronunciation_score\n            + aggregate_weights["prosody"] * prosody_score\n            + aggregate_weights["fluency"] * fluency_score\n            + aggregate_weights["tone"] * tone_score\n        )\n        / aggregate_denominator\n    )\n    total_before_overall_reliability_cap = int(total_score)\n    overall_reliability_cap_triggered = float(reliability.get("overall", 0.0) or 0.0) < 0.75\n    if overall_reliability_cap_triggered:\n        total_score = min(total_score, 82)\n'''
          if old not in text:
              raise SystemExit("aggregate cap anchor not found")
          text = text.replace(old, new, 1)

          old = '''    target_local_score_valid = not (\n        content_match and content_match.status in {"fail", "uncertain"}\n    )\n'''
          new = '''    reliability_cap_audit = {\n        "schema_version": "reliability_cap_audit_v1",\n        "pre_cap_scores": dict(pre_reliability_cap_scores),\n        "post_component_cap_scores": {\n            "pronunciation": int(pronunciation_score),\n            "prosody": int(prosody_score),\n            "fluency": int(fluency_score),\n            "tone": int(tone_score),\n        },\n        "cap_triggers": {\n            "alignment_equal_fallback": bool(alignment_cap_triggered),\n            "mora_evidence_below_threshold": bool(mora_evidence_cap_triggered),\n            "f0_coverage_below_0_50": bool(f0_cap_triggered),\n            "overall_reliability_below_0_75": bool(overall_reliability_cap_triggered),\n        },\n        "cap_values": {\n            "alignment_pronunciation": 80,\n            "mora_evidence_pronunciation": 60,\n            "f0_coverage_prosody": 55,\n            "overall_total": 82,\n        },\n        "aggregate_weights": dict(aggregate_weights),\n        "pre_component_cap_total": int(pre_component_cap_total),\n        "post_component_cap_total": int(total_before_overall_reliability_cap),\n        "post_overall_cap_total": int(total_score),\n        "user_facing": False,\n        "product_score_changed": False,\n        "interpretation": "audit_only_pre_post_cap_snapshot_not_a_new_scoring_policy",\n    }\n\n    target_local_score_valid = not (\n        content_match and content_match.status in {"fail", "uncertain"}\n    )\n'''
          if old not in text:
              raise SystemExit("telemetry object anchor not found")
          text = text.replace(old, new, 1)

          old = '''            "reliability": reliability,\n            "technical_feedback": {\n'''
          new = '''            "reliability": reliability,\n            "reliability_cap_audit": reliability_cap_audit,\n            "technical_feedback": {\n'''
          if old not in text:
              raise SystemExit("details insertion anchor not found")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          print("patched", path)
          PY
      - name: Commit telemetry patch
        run: |
          if git diff --quiet -- ver1.3/src/jp_speech_eval/evaluator.py; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ver1.3/src/jp_speech_eval/evaluator.py
          git commit -m "evaluator: persist exact pre/post reliability cap telemetry"
          git push origin HEAD:fluency-reliability-evolution-v3
