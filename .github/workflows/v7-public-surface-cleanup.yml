name: v7-public-surface-cleanup
on:
  push:
    paths:
      - '.github/workflows/v7-public-surface-cleanup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hf-space-karaoke-integration-v7
          fetch-depth: 0
      - run: python .github/tmp_v7_public_surface_cleanup.py
      - name: Check browser JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('ver1.3/debug_ui/index.html').read_text(encoding='utf-8')
          Path('/tmp/index-inline.js').write_text(text.split('<script>')[1].split('</script>',1)[0], encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ver1.3/debug_ui/index.html
          git commit -m 'ui: simplify public HF Space result surface'
          git push origin HEAD:hf-space-karaoke-integration-v7
