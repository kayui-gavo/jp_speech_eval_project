name: v6-preserve-existing-hf-space-ui
on:
  push:
    paths:
      - '.github/workflows/v6-fix-hf-root.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: karaoke-consumer-ui-v6
          fetch-depth: 0
      - name: Preserve existing Space root
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ver1.3/scripts/debug_ui.py')
          s = p.read_text()
          old = '''    def do_GET(self) -> None:\n        if self.path == "/" and bool(getattr(self.server, "public_demo", False)):\n            self.path = "/consumer_v3.html"\n            return super().do_GET()\n        if self.path in {"/consumer", "/consumer/"}:\n'''
          new = '''    def do_GET(self) -> None:\n        # Keep the established Hugging Face Space / debug root on index.html.\n        # The experimental consumer surface remains available explicitly at /consumer.\n        if self.path in {"/consumer", "/consumer/"}:\n'''
          if old not in s:
              raise SystemExit('expected public-root redirect block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ver1.3/scripts/debug_ui.py
          git commit -m 'fix: preserve established HF Space root UI'
          git push origin HEAD:karaoke-consumer-ui-v6
