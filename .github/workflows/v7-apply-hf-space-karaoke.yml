name: v7-apply-hf-space-karaoke
on:
  push:
    paths:
      - '.github/workflows/v7-apply-hf-space-karaoke.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hf-space-karaoke-integration-v7
          fetch-depth: 0
      - name: Apply incremental Space UI patch
        run: python .github/tmp_patch_hf_space_karaoke_v7.py
      - name: Parse browser JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('ver1.3/debug_ui/index.html').read_text(encoding='utf-8')
          parts = text.split('<script>')
          assert len(parts) == 2
          Path('/tmp/index-inline.js').write_text(parts[1].split('</script>', 1)[0], encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
      - name: Commit integration
        shell: bash
        run: |
          git checkout -- .github/workflows/baseline-evolution-light-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ver1.3/debug_ui/index.html
          git commit -m 'ui: polish HF Space replay audio path'
          git push origin HEAD:hf-space-karaoke-integration-v7
