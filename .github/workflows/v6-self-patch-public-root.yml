name: v6-one-shot-public-root

on:
  push:
    branches:
      - karaoke-consumer-ui-v6
    paths:
      - ".github/workflows/v6-self-patch-public-root.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: karaoke-consumer-ui-v6
      - name: Route public demo root to consumer UI
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("ver1.3/scripts/debug_ui.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def do_GET(self) -> None:\n        if self.path in {"/consumer", "/consumer/"}:\n            self.path = "/consumer_v3.html"\n            return super().do_GET()\n        if self.path == "/api/config":\n'''
          new = '''    def do_GET(self) -> None:\n        if self.path == "/" and bool(getattr(self.server, "public_demo", False)):\n            self.path = "/consumer_v3.html"\n            return super().do_GET()\n        if self.path in {"/consumer", "/consumer/"}:\n            self.path = "/consumer_v3.html"\n            return super().do_GET()\n        if self.path == "/api/config":\n'''
          if old not in text:
              raise SystemExit("consumer route anchor missing")
          text = text.replace(old, new, 1)
          old = '''    server.retain_uploads = not args.public_demo\n    server.enable_logs = not args.public_demo\n    server.server_label = "Public demo" if args.public_demo else "Local debug"\n'''
          new = '''    server.public_demo = bool(args.public_demo)\n    server.retain_uploads = not args.public_demo\n    server.enable_logs = not args.public_demo\n    server.server_label = "Public demo" if args.public_demo else "Local debug"\n'''
          if old not in text:
              raise SystemExit("public demo server anchor missing")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit root routing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add ver1.3/scripts/debug_ui.py
          git commit -m "ui: make public demo open the consumer practice surface"
          git push origin HEAD:karaoke-consumer-ui-v6
