name: v8-baseline-control

on:
  push:
    branches:
      - scoring-integrity-v8
    paths:
      - ".github/workflows/v8-baseline-control.yml"

jobs:
  v7-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hf-space-karaoke-integration-v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install identical lightweight runtime
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            "numpy>=1.24,<2.0" \
            "scipy>=1.10,<2.0" \
            "librosa>=0.10.1,<1.0" \
            "soundfile>=0.12,<1.0" \
            "matplotlib>=3.7,<4.0" \
            "pyopenjtalk-plus==0.4.1.post8" \
            "pyworld-prebuilt>=0.3.5,<0.4" \
            pytest
          python -m pip install -e ver1.3
      - name: Run full v7 control suite
        run: |
          cd ver1.3
          python -m pytest -q
