name: v8-scoring-integrity-bootstrap

on:
  push:
    branches:
      - scoring-integrity-v8
    paths:
      - ".github/workflows/v8-scoring-integrity-bootstrap.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scoring-integrity-v8
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply scoring-integrity repairs
        run: |
          python scripts/apply_v8_patch_bootstrap.py
          python scripts/apply_v8_patch_corrections.py
      - name: Install lightweight runtime
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            "numpy>=1.24,<2.0" \
            "scipy>=1.10,<2.0" \
            "librosa>=0.10.1,<1.0" \
            "soundfile>=0.12,<1.0" \
            "matplotlib>=3.7,<4.0" \
            "pyopenjtalk-plus==0.4.1.post8" \
            "pyworld-prebuilt>=0.3.5,<0.4" \
            pytest
          python -m pip install -e ver1.3
      - name: Run v8 targeted guards
        run: |
          cd ver1.3
          python -m pytest -q \
            tests/test_scoring_integrity_v8.py \
            tests/test_transcript_assisted_language_gate.py \
            tests/test_consumer_dimension_policy.py \
            tests/test_karaoke_timeline.py \
            tests/test_reference_boundary_provenance.py
      - name: Run full lightweight suite
        run: |
          cd ver1.3
          python -m pytest -q
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ver1.3 .github/workflows/baseline-evolution-light-tests.yml
          git commit -m "fix: enforce scoring evidence integrity v8"
          git push origin HEAD:scoring-integrity-v8
