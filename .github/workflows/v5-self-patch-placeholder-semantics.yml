name: v5-one-shot-placeholder-semantics

on:
  push:
    branches:
      - free-speech-promotion-gate-v5
    paths:
      - ".github/workflows/v5-self-patch-placeholder-semantics.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: free-speech-promotion-gate-v5
      - name: Keep unavailable neutral placeholders out of criterion evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("ver1.3/scripts/analyze_free_speech_promotion_v5.py")
          text = path.read_text(encoding="utf-8")

          old = '''        score = _finite(surface.get("evidence_value")) if surface is not None else None\n        is_unsafe = score is not None and score < minimum_candidate_score\n'''
          new = '''        score = (\n            _finite(surface.get("fallback_numeric_value"))\n            if surface is not None\n            else None\n        )\n        is_unsafe = score is not None and score < minimum_candidate_score\n'''
          if old not in text:
              raise SystemExit("F0 fallback anchor not found")
          text = text.replace(old, new, 1)

          old = '''            "condition", "channel_pair_id", "source_recording_id", "expected_language",\n            "score_contract_version", "evidence_schema_version", "candidate_surface_policy_id",\n'''
          new = '''            "condition", "channel_pair_id", "source_recording_id", "expected_language",\n            "fallback_numeric_value", "score_contract_version", "evidence_schema_version",\n            "candidate_surface_policy_id",\n'''
          if old not in text:
              raise SystemExit("required evidence placeholder anchor not found")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ver1.3/scripts/analyze_free_speech_promotion_v5.py
          git commit -m "research: keep neutral placeholders out of criterion evidence"
          git push origin HEAD:free-speech-promotion-gate-v5
